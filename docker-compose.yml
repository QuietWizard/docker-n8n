version: "3.8"

# ============================================================
#  N8N Self-Hosted — Docker Compose with Full Persistence
# ============================================================
#  All data (workflows, credentials, execution history)
#  is stored in named Docker volumes and a local bind-mount,
#  so nothing is lost when you restart or recreate containers.
#
#  Quick start:
#    1. Copy .env.example → .env and fill in your values
#    2. docker compose up -d
#    3. Open http://localhost:5678
#
#  Update:
#    docker compose pull && docker compose up -d
# ============================================================

services:

  # ----------------------------------------------------------
  #  PostgreSQL — production-grade persistent database
  # ----------------------------------------------------------
  n8n-postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-n8n}
      POSTGRES_USER:     ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n8n-internal

  # ----------------------------------------------------------
  #  N8N — workflow automation engine
  # ----------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # ── Timezone ──────────────────────────────────────────
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/New_York}
      TZ:               ${GENERIC_TIMEZONE:-America/New_York}

      # ── Database (PostgreSQL) ──────────────────────────────
      DB_TYPE:                    postgresdb
      DB_POSTGRESDB_HOST:         n8n-postgres
      DB_POSTGRESDB_PORT:         5432
      DB_POSTGRESDB_DATABASE:     ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER:         ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD:     ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      # ── Security ───────────────────────────────────────────
      # IMPORTANT: Generate once and never change — losing this
      # key makes all stored credentials unreadable.
      N8N_ENCRYPTION_KEY:         ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

      # ── Runtime ────────────────────────────────────────────
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED:        "true"
      NODE_ENV:                   production

      # ── Execution history pruning ──────────────────────────
      # Keep execution logs for 7 days (168 h) to save disk space.
      # Set to "false" to keep everything forever.
      EXECUTIONS_DATA_PRUNE:    ${EXECUTIONS_DATA_PRUNE:-true}
      EXECUTIONS_DATA_MAX_AGE:  ${EXECUTIONS_DATA_MAX_AGE:-168}

      # ── Optional: public webhook URL ───────────────────────
      # Uncomment and set if n8n is exposed behind a reverse proxy.
      # WEBHOOK_URL: https://n8n.yourdomain.com/

      # ── Resell Ledger workflow (n8n/resell-ledger-ai-workflow.json) ──
      # BYOA AI provider — all three kept live; AI_PROVIDER picks which one
      # the workflow's AI nodes actually read (see RESELL_AI_PROVIDER in .env).
      AI_PROVIDER: ${RESELL_AI_PROVIDER:?RESELL_AI_PROVIDER is required (ANTHROPIC | ABACUS | OPENROUTER | GOOGLE)}

      AI_API_BASE_URL_ANTHROPIC:    ${RESELL_AI_API_BASE_URL_ANTHROPIC:-}
      AI_API_KEY_ANTHROPIC:         ${RESELL_AI_API_KEY_ANTHROPIC:-}
      AI_MODEL_VISION_ANTHROPIC:    ${RESELL_AI_MODEL_VISION_ANTHROPIC:-}
      AI_MODEL_RESEARCH_ANTHROPIC:  ${RESELL_AI_MODEL_RESEARCH_ANTHROPIC:-}
      AI_MODEL_VALUATION_ANTHROPIC: ${RESELL_AI_MODEL_VALUATION_ANTHROPIC:-}
      AI_MODEL_WRITER_ANTHROPIC:    ${RESELL_AI_MODEL_WRITER_ANTHROPIC:-}

      AI_API_BASE_URL_ABACUS:    ${RESELL_AI_API_BASE_URL_ABACUS:-}
      AI_API_KEY_ABACUS:         ${RESELL_AI_API_KEY_ABACUS:-}
      AI_MODEL_VISION_ABACUS:    ${RESELL_AI_MODEL_VISION_ABACUS:-}
      AI_MODEL_RESEARCH_ABACUS:  ${RESELL_AI_MODEL_RESEARCH_ABACUS:-}
      AI_MODEL_VALUATION_ABACUS: ${RESELL_AI_MODEL_VALUATION_ABACUS:-}
      AI_MODEL_WRITER_ABACUS:    ${RESELL_AI_MODEL_WRITER_ABACUS:-}

      AI_API_BASE_URL_OPENROUTER:    ${RESELL_AI_API_BASE_URL_OPENROUTER:-}
      AI_API_KEY_OPENROUTER:         ${RESELL_AI_API_KEY_OPENROUTER:-}
      AI_MODEL_VISION_OPENROUTER:    ${RESELL_AI_MODEL_VISION_OPENROUTER:-}
      AI_MODEL_RESEARCH_OPENROUTER:  ${RESELL_AI_MODEL_RESEARCH_OPENROUTER:-}
      AI_MODEL_VALUATION_OPENROUTER: ${RESELL_AI_MODEL_VALUATION_OPENROUTER:-}
      AI_MODEL_WRITER_OPENROUTER:    ${RESELL_AI_MODEL_WRITER_OPENROUTER:-}

      AI_API_BASE_URL_GOOGLE:    ${RESELL_AI_API_BASE_URL_GOOGLE:-}
      AI_API_KEY_GOOGLE:         ${RESELL_AI_API_KEY_GOOGLE:-}
      AI_MODEL_VISION_GOOGLE:    ${RESELL_AI_MODEL_VISION_GOOGLE:-}
      AI_MODEL_RESEARCH_GOOGLE:  ${RESELL_AI_MODEL_RESEARCH_GOOGLE:-}
      AI_MODEL_VALUATION_GOOGLE: ${RESELL_AI_MODEL_VALUATION_GOOGLE:-}
      AI_MODEL_WRITER_GOOGLE:    ${RESELL_AI_MODEL_WRITER_GOOGLE:-}
      # Brave Search
      BRAVE_API_KEY:        ${RESELL_BRAVE_API_KEY:-}
      # eBay Developer API (optional — workflow soft-fails without it)
      EBAY_CLIENT_ID:       ${RESELL_EBAY_CLIENT_ID:-}
      EBAY_CLIENT_SECRET:   ${RESELL_EBAY_CLIENT_SECRET:-}
      # eBay Marketplace Account Deletion notification endpoint (separate small workflow)
      EBAY_VERIFICATION_TOKEN:   ${RESELL_EBAY_VERIFICATION_TOKEN:-}
      EBAY_NOTIFICATION_ENDPOINT: ${RESELL_EBAY_NOTIFICATION_ENDPOINT:-}
      # Supabase (the resale-ledger project's DB — service role key, not anon)
      SUPABASE_URL:         ${RESELL_SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${RESELL_SUPABASE_SERVICE_KEY:-}
      # Error notifications (optional — configure at least one)
      ERROR_NOTIFY_WEBHOOK: ${RESELL_ERROR_NOTIFY_WEBHOOK:-}
      ERROR_NOTIFY_EMAIL:   ${RESELL_ERROR_NOTIFY_EMAIL:-}
      # Shared secret the resale-ledger app sends as x-webhook-secret
      WEBHOOK_SECRET:       ${RESELL_WEBHOOK_SECRET:?RESELL_WEBHOOK_SECRET is required}

    volumes:
      # Persists the SQLite fallback DB, encryption key, instance
      # logs, and source-control assets across restarts.
      - n8n_data:/home/node/.n8n

      # Shared folder for Read/Write-File nodes.
      # In your workflows use the path /files/your-file.csv
      - ./local-files:/files

    depends_on:
      n8n-postgres:
        condition: service_healthy
    networks:
      - n8n-internal

  # ----------------------------------------------------------
  #  Cloudflare Tunnel — exposes n8n publicly at a stable hostname
  #  (currently: ebay-notify.michaelfoss.dev, for eBay's Marketplace
  #  Account Deletion notification endpoint). Reaches n8n over the
  #  internal Docker network — port 5678 is never exposed to the internet.
  # ----------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: n8n-cloudflared
    restart: unless-stopped
    command: tunnel run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - /Users/mfoss/.cloudflared/0ca7a51b-c4df-4b2a-8181-c82e6a4853d9.json:/etc/cloudflared/creds.json:ro
    depends_on:
      - n8n
    networks:
      - n8n-internal

# ============================================================
#  Named volumes — data lives here even after "docker compose down"
#  Use "docker compose down -v" ONLY if you want to WIPE everything.
# ============================================================
volumes:
  n8n_data:
    driver: local
  postgres_data:
    driver: local

# ============================================================
#  Internal network — containers talk to each other by name
# ============================================================
networks:
  n8n-internal:
    driver: bridge